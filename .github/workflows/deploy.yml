# main -> ghcr.io/<owner>/javaquestions-backend:main -> Java_Questions/prod -> api.devg.uz
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ghcr faqat kichik harfli nomni qabul qiladi
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ko'chuvchi teg (compose shuni tortadi) + qotib qolgan teg (rollback uchun)
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}

  # Noutbukdagi runner o'chiq bo'lsa, bu job navbatda kutib turadi
  # va runner yoqilganda bajariladi.
  deploy:
    needs: build
    runs-on: self-hosted
    permissions:
      packages: read
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - working-directory: /home/devg/my-folder/Java_Questions/prod
        run: |
          docker compose pull backend
          docker compose up -d backend
