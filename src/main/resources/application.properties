spring.application.name=javaquestions-backend
server.port=${SERVER_PORT:8080}

# Lokal ishga tushirishda default qiymatlar ishlaydi.
# Production'da qiymatlarni prod/.env orqali docker-compose beradi.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javaquestions}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
